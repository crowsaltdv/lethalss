<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lethal Company (local single-player web build)</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #e8a03c; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; display: block; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 2; }
      #loading h1 { font-size: 22px; letter-spacing: 4px; margin: 0 0 18px; font-weight: normal; }
      #bar { width: min(420px, 70vw); height: 8px; border: 1px solid #e8a03c; }
      #bar-full { height: 100%; width: 0%; background: #e8a03c; }
      #status { margin-top: 14px; font-size: 13px; opacity: .8; }
      #warning { position: fixed; left: 0; right: 0; top: 0; z-index: 3; display: none; }
      #fs { position: fixed; right: 10px; bottom: 10px; z-index: 3; background: #1b1b1b; color: #e8a03c; border: 1px solid #e8a03c; padding: 4px 10px; cursor: pointer; font-family: monospace; opacity: .5; }
      #fs:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>LOADING</h1>
      <div id="bar"><div id="bar-full"></div></div>
      <div id="status">starting...</div>
    </div>
    <div id="warning"></div>
    <button id="fs" style="display:none">fullscreen</button>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var barFull = document.querySelector("#bar-full");
      var statusEl = document.querySelector("#status");
      var warningBanner = document.querySelector("#warning");
      var fsButton = document.querySelector("#fs");

      function unityShowBanner(msg, type) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.style = 'padding: 6px 10px; background: ' + (type == 'error' ? '#b00020' : '#c9a100') + '; color: #fff;';
        warningBanner.appendChild(div);
        warningBanner.style.display = 'block';
        if (type != 'error') setTimeout(function () { warningBanner.removeChild(div); if (!warningBanner.children.length) warningBanner.style.display = 'none'; }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebBuild.data.br",
        frameworkUrl: buildUrl + "/WebBuild.framework.js.br",
        codeUrl: buildUrl + "/WebBuild.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ZeekerssRBLX",
        productName: "Lethal Company",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        devicePixelRatio: 1,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebBuild.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          barFull.style.width = (100 * progress) + "%";
          statusEl.textContent = progress < 0.9 ? "downloading game data " + Math.round(progress * 100) + "%" : "starting the game...";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          fsButton.style.display = "block";
          fsButton.onclick = function () { unityInstance.SetFullscreen(1); };
          window.unityInstance = unityInstance;
        }).catch(function (message) {
          statusEl.textContent = "failed to start: " + message;
          statusEl.style.color = "#ff6060";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
